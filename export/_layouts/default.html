<!doctype html>
<html lang="{{ site.lang | default: 'fr' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{{ page.title | default: site.title }}</title>
    <style>
      :root {
        --ink: #202b36;
        --paper: #f5f1e8;
        --accent: #8a2e32;
        --line: #c7bcaa;
        --muted: #59646d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        background: repeating-linear-gradient(0deg, rgba(32, 43, 54, 0.025) 0 1px, transparent 1px 4px), var(--paper);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.05rem;
        line-height: 1.7;
      }
      header, main, footer { width: min(72rem, calc(100% - 2.5rem)); margin: 0 auto; }
      header { padding: 2.5rem 0 1.25rem; border-bottom: 1px solid var(--line); }
      header a { color: var(--accent); text-decoration: none; font-weight: 700; }
      header p { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.92rem; }
      main { padding: 2.5rem 0 4rem; }
      h1, h2, h3 { color: #4e2024; line-height: 1.2; }
      h1 { font-size: 2.35rem; margin-top: 0; }
      h2 { border-bottom: 1px solid var(--line); margin-top: 2.5rem; padding-bottom: 0.45rem; }
      a { color: var(--accent); }
      blockquote { border-left: 0.28rem solid var(--accent); margin-left: 0; padding-left: 1rem; color: var(--muted); }
      pre { overflow-x: auto; padding: 1rem; background: #ebe4d6; border: 1px solid var(--line); }
      table { display: block; overflow-x: auto; border-collapse: collapse; }
      th, td { border: 1px solid var(--line); padding: 0.5rem 0.7rem; text-align: left; }
      .mermaid { background: #fffdf8; padding: 1rem; overflow-x: auto; }
      footer { padding: 1.5rem 0 3rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <header>
      <a href="{{ '/' | relative_url }}">Les Schattenjagers</a>
      <p>Documents narratifs de travail</p>
    </header>
    <main>
      {{ content }}
    </main>
    <footer>Archives narratives privees de la saga Les Schattenjagers.</footer>
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
      document.querySelectorAll('pre > code.language-mermaid').forEach((codeBlock) => {
        const diagram = document.createElement('div');
        diagram.className = 'mermaid';
        diagram.textContent = codeBlock.textContent;
        codeBlock.parentElement.replaceWith(diagram);
      });
      mermaid.initialize({ startOnLoad: true, theme: 'neutral' });
    </script>
  </body>
</html>
